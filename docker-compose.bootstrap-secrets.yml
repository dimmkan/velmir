services:
  bootstrap:
    environment:
      VELMIR_BOOTSTRAP_ADMIN_LOGIN: ""
      VELMIR_BOOTSTRAP_ADMIN_LOGIN_FILE: /run/secrets/bootstrap_admin_login
      VELMIR_BOOTSTRAP_ADMIN_EMAIL: ""
      VELMIR_BOOTSTRAP_ADMIN_PASSWORD: ""
      VELMIR_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - bootstrap_admin_login
      - bootstrap_admin_password

secrets:
  bootstrap_admin_login:
    file: ./secrets/bootstrap_admin_login
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
