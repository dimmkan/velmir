services:
  admin-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: velmir
      POSTGRES_PASSWORD: velmir_local_only
      POSTGRES_DB: velmir_admin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velmir -d velmir_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  target-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: velmir_target_admin
      POSTGRES_PASSWORD: target_admin_local_only
      POSTGRES_DB: velmir_demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
      - ./docker/target-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velmir_target_admin -d velmir_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  admin-db-data:
  target-db-data:
