services:
  admin-db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  migrate:
    environment:
      ADMIN_DATABASE_URL: ""
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
    secrets:
      - admin_database_url

  bootstrap:
    environment:
      ADMIN_DATABASE_URL: ""
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
    secrets:
      - admin_database_url

  app:
    environment:
      ADMIN_DATABASE_URL: ""
      ADMIN_DATABASE_URL_FILE: /run/secrets/admin_database_url
    secrets:
      - admin_database_url

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  admin_database_url:
    file: ./secrets/admin_database_url
